services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/app.db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-compute-formula}
    volumes:
      - app-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "21111:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
